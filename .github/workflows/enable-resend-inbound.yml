name: Ensure Resend outbound DNS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensure-resend-outbound-dns
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test outbound-only DNS plan
        run: node scripts/test_apply_spaceship_resend_dns.mjs
      - name: Repair only approved Resend outbound records
        env:
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
        run: node scripts/apply_spaceship_resend_dns.mjs --apply
      - name: Confirm public Resend outbound DNS and website DNS
        run: node scripts/check_resend_dns.mjs
