name: iCloud custom domain cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose the DNS operation
        required: true
        type: choice
        options:
          - cutover
          - rollback
      confirmation:
        description: Type ICLOUD-CUTOVER for cutover or ICLOUD-ROLLBACK for rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: icloud-domain-dns
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate explicit confirmation
        shell: bash
        run: |
          if [ "${{ inputs.mode }}" = "cutover" ] && [ "${{ inputs.confirmation }}" != "ICLOUD-CUTOVER" ]; then
            echo 'Cutover confirmation mismatch'; exit 1
          fi
          if [ "${{ inputs.mode }}" = "rollback" ] && [ "${{ inputs.confirmation }}" != "ICLOUD-ROLLBACK" ]; then
            echo 'Rollback confirmation mismatch'; exit 1
          fi
      - name: Run guarded DNS migration
        env:
          SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
          SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
        run: node scripts/icloud_dns_migration.mjs --${{ inputs.mode }}
      - name: Verify Resend outbound remains valid
        run: node scripts/check_resend_dns.mjs --strict
