name: Run approved executive outreach batch 02

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-executive-batch02.yml'

permissions:
  contents: read

concurrency:
  group: executive-batch02-once
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ICLOUD_SMTP_USER: ragunauthramsaroop@icloud.com
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install outreach dependencies
        run: python -m pip install --disable-pip-version-check 'reportlab==4.2.5' 'pypdf==6.1.1' cryptography

      - name: Expand approved campaign
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          CAMPAIGN='outreach/icloud-outbox/2026-10-03-executive-value-batch-02.campaign.json'
          SEND_PAYLOAD="$(python scripts/build_executive_campaign.py "$CAMPAIGN" | tail -n 1)"
          test -f "$SEND_PAYLOAD"
          echo "payload=$SEND_PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Enforce policy and build combined proposal plus three-page CV
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_outreach_payload_exec.py "${{ steps.expand.outputs.payload }}"

      - name: Verify iCloud credential
        shell: bash
        run: |
          test -n "$ICLOUD_APP_PASSWORD" || { echo 'Missing ICLOUD_APP_PASSWORD'; exit 1; }

      - name: Send approved batch through Apple iCloud SMTP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/send_icloud_batch.py "${{ steps.expand.outputs.payload }}"
