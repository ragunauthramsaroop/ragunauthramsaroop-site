name: Yahoo Inbox hygiene

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'
  push:
    paths:
      - 'scripts/yahoo_inbox_hygiene.py'
      - '.github/workflows/yahoo-inbox-hygiene.yml'

permissions:
  contents: read

jobs:
  yahoo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YAHOO_USER: ragunauthramsaroop@yahoo.com
      YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
      YAHOO_ARCHIVE_FOLDER: Archive
      YAHOO_MAX_MESSAGES: '2000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run conservative Yahoo Inbox hygiene
        run: python scripts/yahoo_inbox_hygiene.py
