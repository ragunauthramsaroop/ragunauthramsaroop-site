name: iCloud SMTP outreach recovery

on:
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Approved recovery JSON under outreach/icloud-recovery/'
        required: true
        type: string
      acknowledge_hm108_pause:
        description: 'Type RESUME after the Apple HM108 sending issue is cleared'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: icloud-smtp-recovery
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ICLOUD_SMTP_USER: ragunauthramsaroop@icloud.com
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
      GITHUB_TOKEN: ${{ github.token }}
      ICLOUD_LEDGER_REPOSITORY: ${{ github.repository }}
      ICLOUD_LEDGER_BRANCH: main
    steps:
      - name: Enforce HM108 safety pause
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.acknowledge_hm108_pause }}" != "RESUME" ]; then
            echo "Automatic iCloud SMTP recovery is paused after repeated Apple HM108 local-policy rejections."
            echo "Do not resume until the Apple/iCloud sending route is cleared or replaced."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Resolve approved recovery payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="${{ inputs.payload_file }}"
          case "$PAYLOAD" in
            outreach/icloud-recovery/*.json) ;;
            *) echo "Refusing payload outside recovery outbox."; exit 1 ;;
          esac
          if [ ! -f "$PAYLOAD" ]; then
            echo "Payload file not found: $PAYLOAD"
            exit 1
          fi
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Verify iCloud credential
        shell: bash
        run: |
          if [ -z "$ICLOUD_APP_PASSWORD" ]; then
            echo "ICLOUD_APP_PASSWORD is not configured."
            exit 1
          fi

      - name: Send guarded text-only recovery outreach
        shell: bash
        run: |
          set -euo pipefail
          python scripts/send_icloud_recovery.py "${{ steps.payload.outputs.payload }}"
