name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect Hostinger form component runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          page_url='https://www.hiringbooster.com/find-a-branch'
          h={'User-Agent':'Mozilla/5.0'}
          r=requests.get(page_url, timeout=30, headers=h)
          soup=BeautifulSoup(r.text,'html.parser')
          candidates=[]
          for tag in soup.find_all(True):
              for k,v in tag.attrs.items():
                  vals=v if isinstance(v,list) else [v]
                  for val in vals:
                      if isinstance(val,str) and ('url' in k.lower() or val.endswith('.js') or '.js?' in val):
                          full=urljoin(r.url,val)
                          if full not in candidates:
                              candidates.append(full)
                              print('ATTR_URL', tag.name, k, full)
          print('CANDIDATE_COUNT',len(candidates))
          for u in candidates:
              try:
                  rr=requests.get(u,timeout=30,headers=h)
              except Exception as e:
                  print('FETCH_ERR',u,e); continue
              ct=rr.headers.get('content-type','')
              if 'javascript' not in ct and '.js' not in u:
                  continue
              text=rr.text
              low=text.lower()
              hits=[k for k in ('submit','form','fetch(','api','token','website-builder') if k in low]
              if not hits:
                  continue
              print('JS_FILE',u,'STATUS',rr.status_code,'LEN',len(text),'HITS',hits)
              for key in ('fetch(','submit','form','token'):
                  start=0
                  shown=0
                  while shown<8:
                      p=low.find(key,start)
                      if p<0: break
                      snippet=text[max(0,p-650):p+1800]
                      if any(x in snippet.lower() for x in ('api','form','token','submit')):
                          print('JS_SNIPPET',key,snippet)
                          shown+=1
                      start=p+len(key)
          PY
