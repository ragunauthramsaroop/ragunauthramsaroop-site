name: HiringBooster executive submission
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Submit through HiringBooster public contact form
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          target='https://www.hiringbooster.com/find-a-branch'
          endpoint_marker='builder-backend.hostinger.com/u1/data/v3/post/'
          lines=[
              'Dear HiringBooster UAE Team,',
              '',
              'I am reaching out for consideration across senior GCC mandates in mining, energy, infrastructure and regulated industries.',
              '',
              'I serve as Liaison Director, Social Responsibility Department at AGM Inc., part of Zijin Mining Group. My scope spans ESG and sustainability, government and regulatory relations, corporate and external affairs, social performance, compliance and strategic stakeholder engagement.',
              '',
              'Across 12+ years in mining, regulated financial services and commercial operations, I have progressed into director-level leadership. I am pursuing Director, Senior Director, Head, Country Leadership, Chief of Staff and VP-track mandates across the UAE, Saudi Arabia, Qatar and wider GCC, including expatriate, residential and rotational assignments.',
              '',
              'Current three-page executive CV: https://ragunauthramsaroop.com/resume.html',
              '',
              'I would welcome consideration for current or upcoming mandates where my background aligns.',
              '',
              'Regards,',
              'Ragunauth Ramsaroop',
              '+592 608 4735',
              'ragunauthramsaroop@icloud.com'
          ]
          message='\n'.join(lines)
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True, args=['--disable-blink-features=AutomationControlled'])
              context=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36', locale='en-US')
              page=context.new_page()
              captured=[]
              def on_response(resp):
                  if endpoint_marker in resp.url:
                      try:
                          body=resp.text()[:1500]
                      except Exception as exc:
                          body=f'<unreadable response: {exc}>'
                      captured.append((resp.status, resp.url, body))
                      print('FORM_RESPONSE_STATUS', resp.status)
                      print('FORM_RESPONSE_URL', resp.url)
                      print('FORM_RESPONSE_BODY', body)
              page.on('response', on_response)
              page.goto(target, wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(4000)
              print('PAGE_TITLE', page.title())
              print('PAGE_URL', page.url)
              form=page.locator('form[name="Contact form 16"]')
              if form.count() == 0:
                  form=page.locator('form').nth(0)
              print('FORM_COUNT', page.locator('form').count())
              print('INPUT_COUNT', form.locator('input').count())
              print('TEXTAREA_COUNT', form.locator('textarea').count())
              form.locator('input').nth(0).fill('Ragunauth Ramsaroop')
              form.locator('input').nth(1).fill('ragunauthramsaroop@icloud.com')
              form.locator('textarea').nth(0).fill(message)
              form.locator('button[type="submit"]').click()
              page.wait_for_timeout(12000)
              print('CAPTURED_FORM_RESPONSES', len(captured))
              print('VISIBLE_TAIL', page.locator('body').inner_text()[-2500:])
              browser.close()
          if not captured:
              raise SystemExit('No HiringBooster form submission response was observed.')
          status=captured[-1][0]
          if status < 200 or status >= 300:
              raise SystemExit(f'HiringBooster form endpoint returned HTTP {status}.')
          print('SUBMITTED HiringBooster executive inquiry through public form')
          PY
