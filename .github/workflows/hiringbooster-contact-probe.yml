name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect HiringBooster page source for submission routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          url='https://www.hiringbooster.com/find-a-branch'
          r=requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS', r.status_code, 'LENGTH', len(r.text))
          html=r.text
          soup=BeautifulSoup(html,'html.parser')
          print('RESOURCE_URLS')
          urls=[]
          for tag in soup.find_all(True):
              for attr in ('src','href','action'):
                  v=tag.get(attr)
                  if v:
                      full=urljoin(r.url,v)
                      if full not in urls:
                          urls.append(full)
          for u in urls:
              if any(k in u.lower() for k in ('js','api','form','asset','script','app')):
                  print(u)
          print('CANDIDATE_STRINGS')
          patterns=[r'https?://[^\"\'<> ]+', r'/[^\"\'<> ]*(?:api|form|submit)[^\"\'<> ]*']
          seen=set()
          for pat in patterns:
              for m in re.findall(pat, html, flags=re.I):
                  if m not in seen:
                      seen.add(m); print(m[:500])
          for needle in ['Contact form 16','formSubmit','submitForm','form_submission','form-submission','api/forms','forms-api']:
              i=html.lower().find(needle.lower())
              if i>=0:
                  print('SNIPPET', needle, html[max(0,i-1200):i+2200])
          PY
