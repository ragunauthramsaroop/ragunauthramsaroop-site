name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch HiringBooster contact page and inspect forms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://www.hiringbooster.com/find-a-branch'
          r=requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
          print('STATUS', r.status_code)
          print('FINAL_URL', r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          forms=soup.find_all('form')
          print('FORM_COUNT', len(forms))
          for i,f in enumerate(forms):
              print('FORM', i, 'ATTRS=', dict(f.attrs))
              print(f.prettify()[:7000])
          print('HTML_MARKERS')
          for marker in ['fetch(', 'axios', 'XMLHttpRequest', 'formspree', 'web3forms', 'emailjs', 'submit']:
              if marker.lower() in r.text.lower():
                  print('FOUND', marker)
          PY
