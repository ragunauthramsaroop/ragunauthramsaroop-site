name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect inline runtime used by HiringBooster form
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          url='https://www.hiringbooster.com/find-a-branch'
          r=requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
          soup=BeautifulSoup(r.text,'html.parser')
          scripts=soup.find_all('script')
          print('SCRIPT_COUNT', len(scripts))
          for i,s in enumerate(scripts):
              txt=s.get_text() or ''
              print('SCRIPT', i, 'TYPE', s.get('type'), 'SRC', s.get('src'), 'LEN', len(txt))
              low=txt.lower()
              if any(k in low for k in ('form','submit','fetch','api','zyro','hostinger')):
                  for k in ('form','submit','fetch','api','zyro','hostinger'):
                      p=low.find(k)
                      if p>=0:
                          print('MATCH', i, k, txt[max(0,p-800):p+2200])
                          break
          for needle in ['websiteId','formId','siteId','Contact form 16','mP4My0Vy09IxKQa9']:
              print('ALL_OCCURRENCES', needle)
              for m in list(re.finditer(re.escape(needle), r.text, flags=re.I))[:10]:
                  p=m.start(); print(r.text[max(0,p-700):p+1400])
          PY
