name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Resolve contact element ID and emitted field names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html, re, requests
          url='https://www.hiringbooster.com/find-a-branch'
          text=requests.get(url, timeout=30, headers={'User-Agent':'Mozilla/5.0'}).text
          decoded=html.unescape(text)
          print('ELEMENT_ID_OCCURRENCES')
          for m in list(re.finditer(r'elementId', decoded, flags=re.I))[:30]:
              p=m.start()
              print(decoded[max(0,p-700):p+1400])
          print('CONTACT_ELEMENT_CONTEXT')
          for needle in ['ai-0K2SwE','Contact form 16','dWxO8kP22PFx3w4yDpMNYZxEqL5ARGbV']:
              p=decoded.find(needle)
              print('NEEDLE',needle,'POS',p)
              if p>=0:
                  print(decoded[max(0,p-1500):p+6500])
          print('FORM_HTML')
          p=decoded.find('<form name="Contact form 16"')
          print(decoded[p:p+5000] if p>=0 else 'NOT_FOUND')
          PY
