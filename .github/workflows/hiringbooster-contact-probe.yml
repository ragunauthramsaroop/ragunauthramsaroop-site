name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser probe
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Trace HiringBooster form submission endpoint without sending
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          target='https://www.hiringbooster.com/find-a-branch'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page()
              captured=[]
              def route_handler(route, request):
                  if request.method.upper() in ('POST','PUT','PATCH'):
                      print('CAPTURED_WRITE', request.method, request.url)
                      print('POST_DATA', request.post_data)
                      captured.append((request.method, request.url, request.post_data))
                      route.abort()
                  else:
                      route.continue_()
              page.route('**/*', route_handler)
              page.goto(target, wait_until='domcontentloaded', timeout=90000)
              page.wait_for_timeout(3000)
              form=page.locator('form').nth(0)
              print('FORMS', page.locator('form').count(), 'INPUTS', form.locator('input').count(), 'TEXTAREAS', form.locator('textarea').count())
              form.locator('input').nth(0).fill('Ragunauth Ramsaroop')
              form.locator('input').nth(1).fill('ragunauthramsaroop@icloud.com')
              form.locator('textarea').nth(0).fill('Executive CV inquiry for senior GCC leadership mandates. Current profile: https://ragunauthramsaroop.com/resume.html')
              form.locator('button[type=submit]').click()
              page.wait_for_timeout(5000)
              print('CAPTURE_COUNT', len(captured))
              print('PAGE_URL', page.url)
              print('BODY_TEXT', page.locator('body').inner_text()[-2000:])
              browser.close()
          PY
