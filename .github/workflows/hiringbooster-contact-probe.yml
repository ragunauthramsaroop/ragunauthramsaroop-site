name: HiringBooster contact route probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hiringbooster-contact-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Resolve Hostinger form mapping
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import requests
          u='https://www.hiringbooster.com/_astro-1759492724590/Page.ChWW9Ppw.js'
          text=requests.get(u, timeout=30, headers={'User-Agent':'Mozilla/5.0'}).text
          probes=['a("on-submit"','emit("on-submit"','on-submit', 'initialElementId','elementId:', '.elementId', 'formData:']
          for needle in probes:
              print('\n===',needle,'===')
              start=0
              count=0
              while count<20:
                  p=text.find(needle,start)
                  if p<0: break
                  print(text[max(0,p-1400):p+3000])
                  start=p+len(needle)
                  count+=1
              print('COUNT_SHOWN',count)
          PY
