name: Forensic design and alignment audit

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'tools/assets/**'
      - 'scripts/visual_alignment_audit.py'
      - 'scripts/homepage_first_screen_audit.py'
      - '.github/workflows/forensic-design-audit.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'tools/assets/**'
      - 'scripts/visual_alignment_audit.py'
      - '.github/workflows/forensic-design-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forensic-design-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify homepage first-screen fit at twelve viewport widths
        run: python scripts/homepage_first_screen_audit.py
      - name: Audit every page at desktop and mobile widths
        run: python scripts/visual_alignment_audit.py --strict
      - name: Capture flagship desktop and mobile renderings
        run: python scripts/flagship_visual_capture.py
      - name: Upload flagship visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flagship-edition-03-visual-evidence
          path: audit/flagship-edition-03/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload forensic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forensic-design-audit
          path: audit/visual-alignment-audit.json
          retention-days: 30
