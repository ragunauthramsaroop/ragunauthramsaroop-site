name: ZGI intelligence dashboard checks

on:
  pull_request:
    paths:
      - "tools/zijin-2259/**"
      - "tests/zijin-dashboard.test.mjs"
      - ".github/workflows/zijin-dashboard-check.yml"
  push:
    branches: [main]
    paths:
      - "tools/zijin-2259/**"
      - "tests/zijin-dashboard.test.mjs"
      - ".github/workflows/zijin-dashboard-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check tools/zijin-2259/app.js
      - name: Verify market sources, privacy and calculator rules
        run: node --test tests/zijin-dashboard.test.mjs
      - name: Verify HTTP-free static paths
        run: |
          test -s tools/zijin-2259/index.html
          test -s tools/zijin-2259/styles.css
          test -s tools/zijin-2259/app.js
          grep -q 'name="robots" content="noindex,nofollow"' tools/zijin-2259/index.html
