name: iCloud SMTP executive outreach

on:
  push:
    branches:
      - main
      - icloud-smtp-outreach
    paths:
      - 'outreach/icloud-outbox/*.json'
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Path to one approved JSON payload under outreach/icloud-outbox/'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: icloud-smtp-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ICLOUD_SMTP_USER: ragunauthramsaroop@icloud.com
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
      ICLOUD_OUTREACH_TO: ${{ secrets.ICLOUD_OUTREACH_TO }}
      GITHUB_TOKEN: ${{ github.token }}
      ICLOUD_LEDGER_REPOSITORY: ${{ github.repository }}
      ICLOUD_LEDGER_BRANCH: main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install outreach dependencies
        run: python -m pip install --disable-pip-version-check 'reportlab==4.2.5' 'pypdf==6.1.1' cryptography

      - name: Resolve approved payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PAYLOAD="${{ inputs.payload_file }}"
          else
            mapfile -t MATCHES < <(git diff-tree --diff-filter=AM --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^outreach/icloud-outbox/[^/]+\.json$' || true)
            if [ "${#MATCHES[@]}" -eq 0 ]; then
              echo "No outbox payload found in this change."
              exit 0
            fi
            if [ "${#MATCHES[@]}" -gt 1 ]; then
              echo "Multiple outbox payloads were changed in one commit (${#MATCHES[@]})."
              echo "Refusing to silently select only the first file. Use one payload per commit or an approved .batch.json manifest."
              exit 1
            fi
            PAYLOAD="${MATCHES[0]}"
          fi
          if [ -z "$PAYLOAD" ]; then
            echo "No outbox payload resolved."
            exit 0
          fi
          case "$PAYLOAD" in
            outreach/icloud-outbox/*.json) ;;
            *) echo "Refusing payload outside approved outbox."; exit 1 ;;
          esac
          if [ ! -f "$PAYLOAD" ]; then
            echo "Payload file not found: $PAYLOAD"
            exit 1
          fi
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Enforce iCloud transport identity
        if: steps.payload.outputs.payload != ''
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.payload.outputs.payload }}" <<'PY'
          import json
          import os
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          smtp_user = os.environ["ICLOUD_SMTP_USER"].strip()
          declared = str(payload.get("sender") or "").strip()
          allowed = {smtp_user, f"Ragunauth Ramsaroop <{smtp_user}>"}

          if declared and declared not in allowed:
              raise SystemExit(
                  f"Transport identity mismatch: payload declares {declared!r}, but this workflow authenticates and sends through iCloud as {smtp_user!r}. "
                  "Do not spoof a verified-domain sender through the iCloud SMTP workflow."
              )

          print(f"Transport identity verified: iCloud SMTP sender {smtp_user}")
          PY

      - name: Expand approved executive campaign
        id: expanded
        if: steps.payload.outputs.payload != ''
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="${{ steps.payload.outputs.payload }}"
          if [[ "$PAYLOAD" == *.campaign.json ]]; then
            SEND_PAYLOAD="$(python scripts/build_executive_campaign.py "$PAYLOAD" | tail -n 1)"
          else
            SEND_PAYLOAD="$PAYLOAD"
          fi
          if [ -z "$SEND_PAYLOAD" ] || [ ! -f "$SEND_PAYLOAD" ]; then
            echo "Resolved send payload does not exist: $SEND_PAYLOAD"
            exit 1
          fi
          echo "payload=$SEND_PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Enforce outreach policy and prepare combined proposal attachment
        id: preflight
        if: steps.expanded.outputs.payload != ''
        shell: bash
        run: |
          set +e
          python scripts/prepare_outreach_payload_exec.py "${{ steps.expanded.outputs.payload }}"
          code=$?
          set -e

          if [ "$code" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" -eq 78 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "Outreach item was blocked by policy before SMTP. This is a controlled safety state, not a workflow fault." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Outreach item blocked by executive-recipient or payload policy. No email was sent."
            exit 0
          fi

          echo "Unexpected outreach preflight failure with exit code $code."
          exit "$code"

      - name: Verify iCloud credential is configured
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          if [ -z "$ICLOUD_APP_PASSWORD" ]; then
            echo "ICLOUD_APP_PASSWORD is not configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Send through fail-closed iCloud ledger route
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/send_icloud_guarded.py "${{ steps.expanded.outputs.payload }}"

      - name: Record controlled policy block
        if: steps.preflight.outputs.blocked == 'true'
        shell: bash
        run: |
          echo 'No SMTP attempt occurred.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review the recipient verification, seniority, company email and strategic brief evidence before resubmitting.' >> "$GITHUB_STEP_SUMMARY"
