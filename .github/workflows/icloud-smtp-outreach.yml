name: iCloud SMTP executive outreach

on:
  push:
    branches:
      - main
      - icloud-smtp-outreach
    paths:
      - 'outreach/icloud-outbox/*.json'
  workflow_dispatch:
    inputs:
      payload_file:
        description: 'Path to one approved JSON payload under outreach/icloud-outbox/'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: icloud-smtp-outreach
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ICLOUD_SMTP_USER: ragunauthramsaroop@icloud.com
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
      ICLOUD_OUTREACH_TO: ${{ secrets.ICLOUD_OUTREACH_TO }}
      GITHUB_TOKEN: ${{ github.token }}
      ICLOUD_LEDGER_REPOSITORY: ${{ github.repository }}
      ICLOUD_LEDGER_BRANCH: main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install outreach dependencies
        run: python -m pip install --disable-pip-version-check 'reportlab==4.2.5' 'pypdf==6.1.1' cryptography

      - name: Resolve approved payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PAYLOAD="${{ inputs.payload_file }}"
          else
            PAYLOAD="$(git diff-tree --diff-filter=AM --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^outreach/icloud-outbox/[^/]+\.json$' | head -n 1 || true)"
          fi
          if [ -z "$PAYLOAD" ]; then
            echo "No outbox payload found in this change."
            exit 0
          fi
          case "$PAYLOAD" in
            outreach/icloud-outbox/*.json) ;;
            *) echo "Refusing payload outside approved outbox."; exit 1 ;;
          esac
          if [ ! -f "$PAYLOAD" ]; then
            echo "Payload file not found: $PAYLOAD"
            exit 1
          fi
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Expand approved executive campaign
        id: expanded
        if: steps.payload.outputs.payload != ''
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="${{ steps.payload.outputs.payload }}"
          if [[ "$PAYLOAD" == *.campaign.json ]]; then
            SEND_PAYLOAD="$(python scripts/build_executive_campaign.py "$PAYLOAD" | tail -n 1)"
          else
            SEND_PAYLOAD="$PAYLOAD"
          fi
          if [ -z "$SEND_PAYLOAD" ] || [ ! -f "$SEND_PAYLOAD" ]; then
            echo "Resolved send payload does not exist: $SEND_PAYLOAD"
            exit 1
          fi
          echo "payload=$SEND_PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Enforce outreach policy and prepare combined proposal attachment
        if: steps.expanded.outputs.payload != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_outreach_payload_exec.py "${{ steps.expanded.outputs.payload }}"

      - name: Verify iCloud credential is configured
        if: steps.expanded.outputs.payload != ''
        shell: bash
        run: |
          if [ -z "$ICLOUD_APP_PASSWORD" ]; then
            echo "ICLOUD_APP_PASSWORD is not configured as a GitHub Actions secret."
            exit 1
          fi

      - name: Send through fail-closed iCloud ledger route
        if: steps.expanded.outputs.payload != ''
        shell: bash
        run: |
          set -euo pipefail
          python scripts/send_icloud_guarded.py "${{ steps.expanded.outputs.payload }}"
