name: Website performance and integrity

on:
  pull_request:
    paths:
      - '**/*.html'
      - 'index.html'
      - 'resume.html'
      - 'data/public-profile.json'
      - 'service-worker.js'
      - 'assets/**'
      - 'gateway/**'
      - 'tools/assets/**'
      - 'scripts/**'
      - 'tools/geolibre/**'
      - 'api/v1/catalog.json'
      - 'tools/categories/research-investment/index.html'
      - 'tools/index.html'
      - 'tools/sitemap.xml'
      - 'start/index.html'
      - 'resources/index.html'
      - 'academy/**'
      - 'observatory/**'
      - 'executive-engagement/**'
      - 'project-workspace/**'
      - 'research-explorer/**'
      - 'subscribe/**'
      - 'data/research-papers.json'
      - 'data/research-pages.json'
      - 'data/academy-assessments.json'
      - 'sitemap.xml'
      - '.github/workflows/site-performance.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'index.html'
      - 'resume.html'
      - 'data/public-profile.json'
      - 'service-worker.js'
      - 'assets/**'
      - 'gateway/**'
      - 'tools/assets/**'
      - 'scripts/**'
      - 'tools/geolibre/**'
      - 'api/v1/catalog.json'
      - 'tools/categories/research-investment/index.html'
      - 'tools/index.html'
      - 'tools/sitemap.xml'
      - 'start/index.html'
      - 'resources/index.html'
      - 'academy/**'
      - 'observatory/**'
      - 'executive-engagement/**'
      - 'project-workspace/**'
      - 'research-explorer/**'
      - 'subscribe/**'
      - 'data/research-papers.json'
      - 'data/research-pages.json'
      - 'data/academy-assessments.json'
      - 'sitemap.xml'
      - '.github/workflows/site-performance.yml'
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Guard homepage, caching and third-party budgets
        run: python scripts/site_performance_guard.py
      - name: Check browser script syntax
        run: |
          node --check service-worker.js
          node --check assets/home-runtime.js
          node --check assets/accessibility.js
          node --check assets/research-assistant.js
          node --check assets/ask-research-ui.js
          node --check assets/guyana-intelligence.js
          node --check assets/observatory-sector-briefs.js
          node --check assets/guyana-daily-briefing.js
          node --check assets/decision-room.js
          node --check tools/assets/tools.js
          node --check gateway/research-ask.mjs
          node --check gateway/vercel/api/research/ask.mjs
          node --check assets/platform.js
          node --check tools/assets/analytics-loader.js
          node --check tools/geolibre/geolibre.js
          node --check assets/project-workspace.js
          node --check assets/research-explorer.js
          node --check assets/indicator-explorer.js
          node --check assets/executive-engagement.js
          node --check assets/subscribe.js
          node --check assets/academy-learning-lab.js
      - name: Verify research assistant grounding
        run: node scripts/test_research_assistant.cjs
      - name: Verify research AI gateway controls
        run: node scripts/test_research_gateway.mjs
      - name: Verify Guyana Intelligence Centre
        run: node scripts/test_guyana_intelligence.cjs
      - name: Verify Observatory sector briefings
        run: node scripts/test_observatory_sector_briefs.cjs
      - name: Verify Executive Guyana Briefing
        run: node scripts/test_daily_guyana_briefing.cjs
      - name: Verify Executive Decision Room
        run: node scripts/test_executive_decision_room.cjs
      - name: Verify route-safe service worker offline behavior
        run: node scripts/test_service_worker_navigation.cjs
      - name: Verify opt-in GeoLibre GIS integration
        run: python scripts/test_geolibre_integration.py
      - name: Verify six connected workspaces and evidence indexes
        run: python scripts/test_six_workspaces.py
      - name: Guard canonical public profile content
        run: python scripts/content_integrity_guard.py
      - name: Check color uniformity
        run: python scripts/color_uniformity_guard.py
      - name: Validate site links, metadata and site resources
        run: python scripts/validate_site.py
      - name: Audit image and HTML sizes
        run: python scripts/performance_budget.py
      - name: Check accessibility baseline
        run: python scripts/accessibility_audit.py
      - name: Verify free tools integrity
        run: python scripts/tools_integrity.py
