name: SSRN Publication Bridge

# This runner cannot sign in through SSRN's Cloudflare security checks.
# Audit and stage materials only; actual submission is through the author's SSRN browser.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ssrn-bridge/**'
      - 'scripts/ssrn_bridge.mjs'
      - 'scripts/ssrn_prepare.py'
      - 'scripts/ssrn_submission_pack.py'
      - '.github/workflows/ssrn-publication-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'ssrn-bridge/**'
      - 'scripts/ssrn_bridge.mjs'
      - 'scripts/ssrn_prepare.py'
      - 'scripts/ssrn_submission_pack.py'
      - '.github/workflows/ssrn-publication-bridge.yml'

permissions:
  contents: read

concurrency:
  group: ssrn-publication-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SSRN_BRIDGE_MODE: audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: python -m pip install 'pypdf==6.1.1' 'reportlab==4.2.5'
      - name: Validate bridge, package builder and author assistant syntax
        run: |
          node --check scripts/ssrn_bridge.mjs
          node --check ssrn-bridge/submission-assistant.js
          python -m py_compile scripts/ssrn_prepare.py scripts/ssrn_submission_pack.py
      - name: Produce checksum-verified prepared PDF and metadata ZIP
        run: python scripts/ssrn_submission_pack.py
      - name: Reconcile registered and pending papers (read-only)
        run: node scripts/ssrn_bridge.mjs
      - name: Upload author-ready submission package
        uses: actions/upload-artifact@v7
        with:
          name: ssrn-author-upload-package
          path: ssrn-bridge/run/ssrn-author-reviewed-submission-pack.zip
          retention-days: 90
          if-no-files-found: error
      - name: Upload public-audit reconciliation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssrn-bridge-results
          path: |
            ssrn-bridge/run/results.json
            ssrn-bridge/run/SUMMARY.md
          retention-days: 90
          if-no-files-found: warn
