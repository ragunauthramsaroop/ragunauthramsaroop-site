name: SSRN Publication Bridge
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Audit or submit staged manuscripts
        options:
          - audit
          - submit
        default: audit
  push:
    branches: [main]
    paths:
      - 'ssrn-bridge/manifest.json'
      - 'ssrn-bridge/pdfs/**'
      - 'scripts/ssrn_bridge.mjs'
      - 'scripts/ssrn_prepare.py'
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf==6.1.1' 'reportlab==4.2.5'
      - run: node scripts/ssrn_bridge.mjs
