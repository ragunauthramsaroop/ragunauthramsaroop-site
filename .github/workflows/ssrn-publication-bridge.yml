name: SSRN Publication Bridge
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Audit or submit staged manuscripts
        options:
          - audit
          - submit
        default: audit
  push:
    branches: [main]
    paths:
      - 'ssrn-bridge/manifest.json'
      - 'ssrn-bridge/pdfs/**'
      - 'scripts/ssrn_bridge.mjs'
      - 'scripts/ssrn_prepare.py'
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSRN_BRIDGE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'audit' }}
      SSRN_EMAIL: ${{ secrets.SSRN_EMAIL }}
      SSRN_PASSWORD: ${{ secrets.SSRN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf==6.1.1' 'reportlab==4.2.5'
      - name: Install SSRN browser for submissions
        if: env.SSRN_BRIDGE_MODE == 'submit'
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Read public SSRN publication register
        run: node scripts/ssrn_bridge.mjs
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssrn-bridge-results
          path: ssrn-bridge/run/
          if-no-files-found: warn
