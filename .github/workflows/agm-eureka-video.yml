name: AGM Eureka Award narrated video
on:
  push:
    branches: [agm-eureka-video]
    paths:
      - 'awards/energy-asia-2027/**'
      - '.github/workflows/agm-eureka-video.yml'
  workflow_dispatch:
jobs:
  render-award-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade edge-tts
      - name: Retrieve AGM solar farm footage
        env:
          SOURCE_VIDEO: https://static.heygen.ai/tmp_resource/d8da643d-136a-459d-a869-fa1e62a39f62
        run: |
          mkdir -p awards/energy-asia-2027/output
          curl -fL --retry 3 --connect-timeout 30 --max-time 240 "$SOURCE_VIDEO" -o awards/energy-asia-2027/output/source.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 awards/energy-asia-2027/output/source.mp4
      - name: Render narrated three-minute competition video
        run: python awards/energy-asia-2027/render.py
      - name: Verify duration
        run: ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 awards/energy-asia-2027/output/AGM_Inc_Energy_Asia_Eureka_2027_Three_Minute_Pitch.mp4
      - name: Upload downloadable MP4 and English captions
        uses: actions/upload-artifact@v4
        with:
          name: AGM-Energy-Asia-2027-Eureka-Final-Video
          path: |
            awards/energy-asia-2027/output/AGM_Inc_Energy_Asia_Eureka_2027_Three_Minute_Pitch.mp4
            awards/energy-asia-2027/output/English_Subtitles.srt
            awards/energy-asia-2027/output/README.txt
          retention-days: 30
